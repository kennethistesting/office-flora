name: Publish Office Flora Entry

on:
  push:
    branches:
      - main
    paths:
      - 'publish-queue/**/entry.json'
      - 'publish-queue/**/*.base64'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Path to entry.json'
        required: true
        default: 'publish-queue/example/entry.json'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find manifest
        id: manifest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.manifest }}" >> "$GITHUB_OUTPUT"
          else
            MANIFEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^publish-queue/.*/entry.json$' | head -n 1)
            if [ -z "$MANIFEST" ]; then
              echo "No entry.json was added or changed in this commit."
              echo "path=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "path=$MANIFEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish entry to Supabase
        if: steps.manifest.outputs.path != ''
        env:
          OFFICE_FLORA_PUBLISH_TOKEN: ${{ secrets.OFFICE_FLORA_PUBLISH_TOKEN }}
        run: node scripts/publish-flora-entry.mjs "${{ steps.manifest.outputs.path }}"

      - name: Remove publish queue files after success
        if: steps.manifest.outputs.path != ''
        shell: bash
        run: |
          DIR=$(dirname "${{ steps.manifest.outputs.path }}")
          rm -rf "$DIR"

      - name: Commit queue cleanup
        if: steps.manifest.outputs.path != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Cleanup published Office Flora queue"
          git push
